# bluetoothd's configuration on Mica OS, read through -f in place of bluez's
# /etc/bluetooth/main.conf (whose keys are all commented, so every other setting
# is bluetoothd's default). The LE connection interval is asked for in units of
# 1.25 ms: 11.25-15 ms, where a phone's default of 30-50 ms makes BLE
# provisioning slow.
[LE]
MinConnectionInterval=9
MaxConnectionInterval=12
