# Mica OS device nodes under mdev (mica-mdev), with the owners and modes udev's
# 50-udev-default.rules gives them. First match wins; a line is
#   <device regex> <user>:<group> <mode> [=<subdirectory>/ | ><link>] [@|$|*<command>]
# A module alias loads its driver; the kernel names firmware and mdev loads it
# from /usr/lib/firmware by itself.
$MODALIAS=.*    root:root 0660 @modprobe -q -b "$MODALIAS"

null            root:root 0666
zero            root:root 0666
full            root:root 0666
random          root:root 0666
urandom         root:root 0666
kmsg            root:root 0640
mem             root:kmem 0640
port            root:kmem 0640

console         root:tty 0600
tty             root:tty 0666
ptmx            root:tty 0666
tty[0-9]+       root:tty 0620
vcsa?[0-9]*     root:tty 0620
# Serial ports, as udev's tty[A-Z]*[0-9] and ttymxc*: ttyS, ttyUSB, ttyACM, ttyAMA, ttyFIQ...
tty[A-Z].*[0-9]|ttymxc[0-9]+ root:dialout 0660

(sd[a-z]+|vd[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+)(p?[0-9]+)? root:disk 0660
mmcblk[0-9]+(boot[0-9]+|rpmb) root:disk 0660
loop[0-9]+      root:disk 0660
loop-control    root:disk 0660
dm-[0-9]+       root:disk 0660
sr[0-9]+        root:cdrom 0660

event[0-9]+     root:input 0660 =input/
mice            root:input 0660 =input/
mouse[0-9]+     root:input 0660 =input/
uinput          root:input 0660

(pcm.*|control.*|midi.*|seq|timer|hwC.*) root:audio 0660 =snd/
fb[0-9]+        root:video 0660
video[0-9]+     root:video 0660
media[0-9]+     root:video 0660
card[0-9]+      root:video 0660 =dri/
renderD[0-9]+   root:render 0660 =dri/
kvm             root:kvm 0660

# Device access for unprivileged apps (config/ids.json), as mica-systemd's
# 60-mica-devices.rules gives them under udev.
gpiochip[0-9]+  root:gpio 0660
i2c-[0-9]+      root:i2c 0660
spidev[0-9]+\.[0-9]+ root:spi 0660

tun             root:root 0666 =net/
rtc0            root:root 0664 >rtc
rtc[0-9]+       root:root 0664
watchdog[0-9]*  root:root 0600
hwrng           root:root 0600
