# Mica OS on OpenRC (mica-openrc), read after /etc/rc.conf.
#
# No daemon keeps CAP_SYS_RESOURCE, so none can write past DATA's project hard
# limits: the counterpart of mica-systemd's service.d drop-in. It applies to what
# start-stop-daemon and supervise-daemon start; the steps that grow DATA run in
# their service scripts and keep it.
capabilities="!cap_sys_resource"
