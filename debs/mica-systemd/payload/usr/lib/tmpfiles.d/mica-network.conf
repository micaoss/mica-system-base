# The network micad configures, kept on DATA so the init applies it at boot with
# or without micad: networkd reads /run/systemd/network and resolved
# /run/systemd/resolved.conf.d, and both are links to /var/lib/mica, which
# micad writes through. A link is not made over a directory that is already
# there, such as one systemd-network-generator made for an ip= on the kernel
# command line; that boot keeps micad's network in RAM.
d /var/lib/mica/network/networkd 0755 root root -
L /run/systemd/network - - - - /var/lib/mica/network/networkd
d /var/lib/mica/dns/resolved.conf.d 0755 root root -
L /run/systemd/resolved.conf.d - - - - /var/lib/mica/dns/resolved.conf.d
