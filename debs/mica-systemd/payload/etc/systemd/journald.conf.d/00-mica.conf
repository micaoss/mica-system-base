# The journal on DATA while /var/log/journal exists, in RAM otherwise: mica-log-settings
# makes or removes the directory from the log settings. Capped at 8 MiB, the cap of the
# smallest DATA; mica-log-settings renders another cap into /run. No debug messages
# are stored.
[Journal]
Storage=auto
SystemMaxUse=8M
SystemMaxFileSize=1M
MaxLevelStore=info
