# The console is an option: no getty starts until it has installed /usr/bin/login.
# On the floor alone agetty would exec a login that is not there, and restart.
# After micad, so the first prompt carries its device code (/etc/issue.d); never
# Requires=, so a root without micad still gets a prompt.
[Unit]
ConditionPathExists=/usr/bin/login
After=micad.service
