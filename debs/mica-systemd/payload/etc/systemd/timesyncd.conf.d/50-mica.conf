# Mica OS time synchronization: polling between 32 s and 2048 s, a 30 s retry
# while no server answers, and the clock saved every 60 s. Fixed policy; the
# settings cover only NTP servers and the timezone.
[Time]
PollIntervalMinSec=32
PollIntervalMaxSec=2048
ConnectionRetrySec=30
SaveIntervalSec=60
