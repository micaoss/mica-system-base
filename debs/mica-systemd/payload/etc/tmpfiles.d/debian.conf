# Replaces Debian's /usr/lib/tmpfiles.d/debian.conf: its /run lines only. The read-only
# root cannot take its /etc/mtab, /etc/default/locale and /etc/vconsole.conf links at
# run time, and nothing here reads them.
L /run/shm             -    -    -    -   /dev/shm
d /run/sendsigs.omit.d 0755 root root -
d /run/lock            1777 root root -
