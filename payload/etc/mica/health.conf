# Mica OS health gate configuration. `key=value` lines; every key but `require`
# is optional and defaults to the value shown.

# The required set, one `require=` line per member. None, or an unknown member,
# refuses the boot confirmation.
#   init          the init is up and has not given up on the boot: any state but
#                 `maintenance` or `stopping`, with nothing waited for
#   boot-settled  the boot transaction finished (`degraded` counts,
#                 `maintenance` does not), waiting up to settle-sec for it
#   micad         micad answers com.mica.micad1 on the system bus
#   apid          `mica-apid --healthcheck` passes: apid answers /healthz on its
#                 local socket, or apid is off by configuration
# A device may run with no network at all, so the default waits for nothing: the
# init alone, and micad where the image carries it, since with micad answering an
# update can still be installed (without it, mica-deploy update over SSH can).
require=init

# The optional components, one `if-installed=` line each: required where the
# image carries the service, not checked where it does not. micad or apid.
if-installed=micad

# With boot-settled required: seconds to wait for the init to leave
# initializing/starting.
settle-sec=60

# Per-probe timeout in seconds.
probe-timeout-sec=10

# /var usage (percent) reported to micad as degraded; never fatal.
var-threshold-pct=85
